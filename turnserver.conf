# Basic coturn config for REST credentials
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=<VPS_PUBLIC_IP>
realm=example.com
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_STATIC_AUTH_SECRET
no-stdout-log
log-file=/var/log/turnserver/turn.log
simple-log
total-quota=100
user-quota=5
stale-nonce
# Optional TLS cert paths if you want to use TLS on 5349
# cert=/etc/letsencrypt/live/example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/example.com/privkey.pem
